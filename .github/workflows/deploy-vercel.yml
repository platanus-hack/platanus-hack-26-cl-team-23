name: Deploy Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate branch / environment
        run: |
          BRANCH="${{ github.ref_name }}"
          ENV="${{ inputs.environment }}"
          if [[ "$ENV" == "production" && "$BRANCH" != "main" ]]; then
            echo "::error::production solo se despliega desde main (lanzado desde '$BRANCH')"
            exit 1
          fi
          if [[ "$ENV" == "preview" && "$BRANCH" != "dev" ]]; then
            echo "::error::preview solo se despliega desde dev (lanzado desde '$BRANCH')"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Pull Vercel environment
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            bunx vercel pull --yes \
              --environment=production \
              --token="$VERCEL_TOKEN"
          else
            bunx vercel pull --yes \
              --environment=preview \
              --git-branch=${{ github.ref_name }} \
              --token="$VERCEL_TOKEN"
          fi

      - name: Build
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            bunx vercel build --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            bunx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            bunx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
