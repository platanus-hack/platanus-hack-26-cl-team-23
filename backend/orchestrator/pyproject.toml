[project]
name = "orchestrator"
version = "0.1.0"
description = "Orchestrator API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "granian[reload]>=2.8.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "poethepoet>=0.34.0",
    "ruff>=0.8.0",
]

[tool.poe.tasks]
dev = "granian --interface asgi --host 0.0.0.0 --port 8080 --reload app.main:app"
test = "pytest -q"
lint = "ruff check ."
fmt = "ruff format ."

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
